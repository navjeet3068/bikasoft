<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#1748a5">
  <title>Disclaimer Declined | Aaranya Consulting</title>
  <link rel="stylesheet" href="assets/style.css?v=shared-shell-responsive-1">
  <style>
    .decline-page{min-height:100vh;display:grid;place-items:center;padding:2rem 0;background:linear-gradient(115deg,#f4f8ff 0%,#eff6ff 48%,#e4efff 100%)}
    .decline-card{width:min(100%,42rem);padding:clamp(2rem,6vw,3.5rem);border:1px solid #dce7f5;border-radius:18px;background:#fff;text-align:center;box-shadow:0 22px 55px rgba(16,42,86,.14)}
    .decline-card img{width:9rem;margin:0 auto 1rem}
    .decline-card h1{margin-bottom:1rem;color:#102a56;font-size:clamp(1.5rem,4vw,2rem)}
    .decline-card p{margin:0 auto;color:#49617f;max-width:34rem}
    .decline-card .button{margin-top:1.5rem}
  </style>
</head>
<body>
  <div data-site-header></div>
  <main class="decline-page">
    <section class="decline-card" aria-labelledby="decline-title">
      <img src="assets/disclaimer-declined.png" alt="Disclaimer Declined">
      <h1 id="decline-title">Disclaimer declined</h1>
      <p>You have chosen not to accept the disclaimer. </p>
      <a class="button" href="/index.html">Try Again</a>
    </section>
  </main>
  <div data-site-footer></div>
  <script src="site-shell.js" defer></script>
</body>
</html>
