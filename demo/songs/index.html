<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2b1a12">
  <meta name="description" content="A nostalgic radio for 90s Hindi film songs, set in an illustrated Indian street-corner saloon.">
  <title>Deluxe Saloon — 90s Hindi Songs &amp; Nostalgia</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Familjen Grotesk", "Nirmala UI", "Noto Sans Devanagari", system-ui, sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --cream: #fff1d5;
      --sand: #e8d4b1;
      --muted: rgba(255, 241, 213, .64);
      --live: #8fcc83;
      --gold: #efbf73;
    }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100svh; margin: 0; overflow: hidden; color: var(--cream); background: #2b1a12; }
    button, input { font: inherit; }
    button { color: inherit; }
    .page { position: relative; width: 100%; height: 100dvh; min-height: 0; overflow: hidden; isolation: isolate; }
    .page::before { position: absolute; z-index: 6; inset: 9px; border: 8px ridge #b88a4c; border-radius: 5px; box-shadow: inset 0 0 0 2px rgba(55,30,16,.95), inset 0 0 0 4px rgba(239,200,117,.92), 0 0 0 2px rgba(45,24,13,.9), 0 8px 28px rgba(0,0,0,.45); content: ""; pointer-events: none; }
    .page::after { position: absolute; z-index: 6; inset: 12px; border: 1px solid rgba(255,228,164,.82); border-radius: 3px; background: radial-gradient(circle, #f4d78f 0 2px, transparent 3px) left top / 24px 24px no-repeat, radial-gradient(circle, #f4d78f 0 2px, transparent 3px) right top / 24px 24px no-repeat, radial-gradient(circle, #f4d78f 0 2px, transparent 3px) left bottom / 24px 24px no-repeat, radial-gradient(circle, #f4d78f 0 2px, transparent 3px) right bottom / 24px 24px no-repeat; content: ""; pointer-events: none; }
    .backdrop { position: absolute; z-index: -3; inset: 17px; }
    .backdrop img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center; }
    .vignette { position: absolute; z-index: -2; inset: 17px; background: linear-gradient(180deg, rgba(28,17,12,.58) 0%, rgba(32,18,11,.12) 30%, rgba(32,18,11,.02) 58%, rgba(22,12,8,.5) 100%), radial-gradient(ellipse at center 43%, transparent 25%, rgba(20,11,8,.1) 72%, rgba(20,11,8,.34)); }
    .grain { position: absolute; z-index: -1; inset: 17px; pointer-events: none; opacity: .12; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.25'/%3E%3C/svg%3E"); mix-blend-mode: soft-light; }
    .topbar { position: absolute; z-index: 2; top: 0; left: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: 100%; padding: 23px clamp(20px, 4.2vw, 64px); color: var(--sand); }
    .station-mark { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 600; letter-spacing: .19em; text-transform: uppercase; }
    .live-status { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .live-count { font-variant-numeric: tabular-nums; font-weight: 650; }
    .online-label { color: rgba(255,241,213,.7); }
    .live-dot { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--live); box-shadow: 0 0 12px rgba(143,204,131,.5); }
    .live-dot::after { position: absolute; inset: -4px; border: 1px solid rgba(143,204,131,.7); border-radius: 50%; content: ""; animation: ping 2.4s ease-out infinite; }
    @keyframes ping { 0% { transform: scale(.5); opacity: .9; } 85%, 100% { transform: scale(1.65); opacity: 0; } }
    .about-button { justify-self: end; display: grid; place-items: center; width: 38px; height: 38px; padding: 0; border: 1px solid rgba(255,241,213,.25); border-radius: 50%; background: rgba(44,27,18,.25); color: var(--sand); cursor: pointer; transition: background .2s, color .2s, border-color .2s; }
    .about-button:hover { border-color: rgba(255,241,213,.55); background: rgba(44,27,18,.55); color: var(--cream); }
    .about-button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .hero { position: absolute; top: clamp(88px, 14vh, 148px); left: 0; display: flex; width: 100%; flex-direction: column; align-items: center; padding: 0 20px; text-align: center; }
    .hero h1 { margin: 0; color: var(--cream); font-family: "Noto Serif Devanagari", "Nirmala UI", "Kohinoor Devanagari", serif; font-size: clamp(4.4rem, 11vw, 9.4rem); font-weight: 800; line-height: .98; letter-spacing: -.065em; text-shadow: 0 6px 26px rgba(30,16,11,.72); }
    .hero h1 span { display: block; }
    .hero-kicker { margin: 18px 0 0; color: rgba(255,241,213,.78); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; letter-spacing: .34em; text-transform: uppercase; text-shadow: 0 2px 14px rgba(30,16,11,.9); }
    .player-dock { position: absolute; z-index: 5; inset: auto 0 max(20px, env(safe-area-inset-bottom)); display: flex; justify-content: center; padding: 0 14px; }
    .custom-player { display: flex; align-items: center; gap: 13px; width: min(100%, 390px); padding: 11px 15px 11px 11px; border: 1px solid rgba(255,241,213,.24); border-radius: 999px; background: linear-gradient(115deg, rgba(48,31,23,.88), rgba(32,23,20,.86)); box-shadow: 0 16px 50px rgba(22,12,7,.42), inset 0 1px rgba(255,244,223,.13); -webkit-backdrop-filter: blur(18px) saturate(120%); backdrop-filter: blur(18px) saturate(120%); }
    .custom-play { display: grid; flex: 0 0 auto; place-items: center; width: 42px; height: 42px; padding: 0; border: 1px solid rgba(255,231,191,.38); border-radius: 50%; background: rgba(255,229,185,.11); color: var(--cream); cursor: pointer; transition: background .18s, transform .18s; }
    .custom-play:hover:not(:disabled) { background: rgba(255,229,185,.2); transform: scale(1.04); }
    .custom-play:disabled { cursor: wait; opacity: .5; }
    .custom-play:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
    .custom-play svg { width: 17px; height: 17px; fill: currentColor; }
    .custom-play .pause-icon { display: none; }
    .custom-play[aria-pressed="true"] .play-icon { display: none; }
    .custom-play[aria-pressed="true"] .pause-icon { display: block; }
    .custom-actions { display: flex; align-items: center; gap: 5px; }
    .custom-skip, .custom-mute { display: grid; flex: 0 0 auto; place-items: center; min-width: 28px; height: 34px; padding: 0 4px; border: 0; background: transparent; color: var(--sand); font-size: 10px; cursor: pointer; }
    .custom-skip:hover:not(:disabled), .custom-mute:hover:not(:disabled) { color: var(--gold); }
    .custom-skip:disabled, .custom-mute:disabled { cursor: wait; opacity: .5; }
    .custom-skip:focus-visible, .custom-mute:focus-visible, .volume-range:focus-visible, .seek-range:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    .seek-line { display: flex; align-items: center; gap: 7px; margin-top: 5px; }
    .seek-range, .volume-range { height: 3px; margin: 0; border-radius: 99px; accent-color: var(--gold); cursor: pointer; }
    .seek-range { min-width: 0; flex: 1; }
    .volume-range { width: 48px; }
    .time-readout { flex: 0 0 auto; color: rgba(255,241,213,.58); font: 9px ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
    .youtube-player-host { position: fixed; top: 0; left: -10000px; width: 200px; height: 200px; overflow: hidden; opacity: 0; pointer-events: none; }
    .youtube-player-host iframe { display: block; width: 200px; height: 200px; border: 0; }
    .custom-track { min-width: 0; flex: 1; }
    .custom-title { overflow: hidden; margin: 0; color: var(--cream); font-size: 13px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .custom-status { margin: 3px 0 0; color: var(--muted); font-size: 10px; }
    .about-overlay { position: fixed; z-index: 10; inset: 0; display: grid; place-items: center; padding: 20px; background: rgba(19,12,9,.56); -webkit-backdrop-filter: blur(9px); backdrop-filter: blur(9px); }
    .about-overlay[hidden] { display: none; }
    .about-card { position: relative; width: min(100%, 440px); padding: 34px; border: 1px solid rgba(255,241,213,.23); border-radius: 22px; background: linear-gradient(145deg, rgba(59,38,27,.96), rgba(35,24,19,.97)); box-shadow: 0 22px 80px rgba(14,8,5,.55); }
    .about-close { position: absolute; top: 13px; right: 13px; display: grid; place-items: center; width: 34px; height: 34px; padding: 0; border: 1px solid rgba(255,241,213,.15); border-radius: 50%; background: transparent; color: var(--sand); cursor: pointer; }
    .about-close svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; }
    .about-card h2 { margin: 0 35px 12px 0; color: var(--cream); font-size: 24px; }
    .about-card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
    .about-card .about-caption { margin-top: 17px; color: rgba(255,241,213,.4); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
    @media (max-width: 650px) {
      .page::before { inset: 5px; border-width: 5px; }
      .page::after { inset: 8px; }
      .backdrop, .vignette, .grain { inset: 10px; }
      .topbar { padding: 18px 18px; }
      .station-mark { max-width: 90px; font-size: 9px; line-height: 1.5; letter-spacing: .12em; }
      .live-status { gap: 6px; font-size: 10px; }
      .hero { top: clamp(106px, 19vh, 168px); }
      .hero h1 { font-size: clamp(4.15rem, 20vw, 7.2rem); }
      .hero-kicker { margin-top: 14px; font-size: 9px; letter-spacing: .23em; }
      .player-dock { bottom: max(13px, env(safe-area-inset-bottom)); padding: 0 10px; }
      .about-card { padding: 29px 24px 25px; }
    }
    @media (max-width: 390px) { .volume-range { width: 34px; } .custom-player { gap: 8px; padding-right: 10px; } .custom-actions { gap: 2px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="page">
    <div class="backdrop" aria-hidden="true">
      <picture>
        <source media="(min-width: 768px)" srcset="saloon-backdrop.jpg">
        <img src="saloon-backdrop-mobile.jpg" alt="">
      </picture>
    </div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <header class="topbar">
      <span class="station-mark">FM · 90s Hindi radio</span>
      <div class="live-status" aria-label="Radio online">
        <span class="live-dot" aria-hidden="true"></span>
        <span class="live-count">24/7</span>
        <span class="online-label">on air</span>
      </div>
      <button class="about-button" type="button" aria-label="About Deluxe Saloon" title="About">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"></circle><path d="M12 11v5M12 8h.01"></path></svg>
      </button>
    </header>

   

    <section class="player-dock" aria-label="Radio player">
      <div class="custom-player">
        <button class="custom-play" type="button" aria-label="Play playlist" aria-pressed="false" disabled>
          <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.7c0-.8.9-1.3 1.6-.9l10 6.2a1.2 1.2 0 0 1 0 2l-10 6.2A1.1 1.1 0 0 1 8 18.3z"></path></svg>
          <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"></path></svg>
        </button>
        <div class="custom-track">
          <p class="custom-title">90s Hindi songs</p>
          <p class="custom-status" aria-live="polite">Connecting to YouTube…</p>
          <div class="seek-line"><span class="time-readout current-time">0:00</span><input class="seek-range" type="range" min="0" max="0" step="1" value="0" aria-label="Seek in song" disabled><span class="time-readout duration-time">0:00</span></div>
        </div>
        <div class="custom-actions">
          <button class="custom-skip previous-button" type="button" aria-label="Previous track" title="Previous track" disabled>◀|</button>
          <button class="custom-skip next-button" type="button" aria-label="Next track" title="Next track" disabled>|▶</button>
          <button class="custom-mute" type="button" aria-label="Mute playback" aria-pressed="false" disabled>Mute</button>
          <input class="volume-range" type="range" min="0" max="100" step="1" value="70" aria-label="Volume" disabled>
        </div>
      </div>
    </section>
    <div class="youtube-player-host" aria-hidden="true"><div id="youtube-player"></div></div>
  </main>

  <div class="about-overlay" hidden>
    <section class="about-card" role="dialog" aria-modal="true" aria-labelledby="about-title">
      <button class="about-close" type="button" aria-label="Close about panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg></button>
      <h2 id="about-title">Welcome to Deluxe Saloon</h2>
      <p>A little corner radio for the Hindi film songs that never left us. Settle in, press play, and let the old favourites roll on.</p>
      <p class="about-caption">90s Hindi songs · open all hours</p>
    </section>
  </div>
  <script>
    const aboutOverlay = document.querySelector('.about-overlay');
    const customPlay = document.querySelector('.custom-play');
    const customMute = document.querySelector('.custom-mute');
    const previousButton = document.querySelector('.previous-button');
    const nextButton = document.querySelector('.next-button');
    const seek = document.querySelector('.seek-range');
    const volume = document.querySelector('.volume-range');
    const currentTime = document.querySelector('.current-time');
    const durationTime = document.querySelector('.duration-time');
    const trackTitle = document.querySelector('.custom-title');
    const customStatus = document.querySelector('.custom-status');
    const playlistId = 'PLfCJZYmp66LI';
    let youtubePlayer;
    let draggingSeek = false;
    let progressFrame = 0;

    const formatTime = (seconds) => {
      const total = Number.isFinite(seconds) ? Math.floor(seconds) : 0;
      return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')}`;
    };

    const syncTrack = () => {
      const video = youtubePlayer?.getVideoData?.();
      if (video?.title) trackTitle.textContent = video.title;
    };

    const updateProgress = () => {
      if (!youtubePlayer) return;
      const duration = youtubePlayer.getDuration() || 0;
      const time = youtubePlayer.getCurrentTime() || 0;
      if (duration > 0) {
        seek.max = Math.floor(duration);
        durationTime.textContent = formatTime(duration);
        if (!draggingSeek) seek.value = Math.floor(time);
        currentTime.textContent = formatTime(draggingSeek ? Number(seek.value) : time);
      }
      if (youtubePlayer.getPlayerState() === YT.PlayerState.PLAYING) {
        progressFrame = requestAnimationFrame(updateProgress);
      } else {
        progressFrame = 0;
      }
    };

    const initializeYoutube = () => {
      const playerVars = { listType: 'playlist', list: playlistId, controls: 0, playsinline: 1, rel: 0, autoplay: 0 };
      if (location.protocol === 'http:' || location.protocol === 'https:') playerVars.origin = location.origin;
      youtubePlayer = new YT.Player('youtube-player', {
        width: '200',
        height: '200',
        playerVars,
        events: {
          onReady: ({ target }) => {
            youtubePlayer = target;
            [customPlay, customMute, previousButton, nextButton, seek, volume].forEach((control) => { control.disabled = false; });
            volume.value = target.getVolume();
            customStatus.textContent = 'Ready to play';
            syncTrack();
          },
          onStateChange: ({ data }) => {
            if (data === YT.PlayerState.PLAYING) {
              customPlay.setAttribute('aria-pressed', 'true');
              customPlay.setAttribute('aria-label', 'Pause playlist');
              customStatus.textContent = 'Now playing';
              syncTrack();
              if (!progressFrame) progressFrame = requestAnimationFrame(updateProgress);
            } else if ([YT.PlayerState.PAUSED, YT.PlayerState.ENDED, YT.PlayerState.CUED].includes(data)) {
              customPlay.setAttribute('aria-pressed', 'false');
              customPlay.setAttribute('aria-label', 'Play playlist');
              if (data === YT.PlayerState.PAUSED) customStatus.textContent = 'Paused';
              syncTrack();
              cancelAnimationFrame(progressFrame);
              progressFrame = 0;
            }
          },
          onError: ({ data }) => {
            const messages = {
              2: 'YouTube rejected the playlist ID',
              5: 'YouTube could not play this video',
              100: 'The first playlist video is private or missing',
              101: 'The first playlist video blocks embedded playback',
              150: 'The first playlist video blocks embedded playback',
              153: 'YouTube needs a page address; open this through a web server'
            };
            customStatus.textContent = messages[data] || `YouTube player error ${data}`;
          },
          onAutoplayBlocked: () => { customStatus.textContent = 'Press play to start'; }
        }
      });
    };

    customPlay.addEventListener('click', () => {
      if (!youtubePlayer) return;
      if (youtubePlayer.getPlayerState() === YT.PlayerState.PLAYING) youtubePlayer.pauseVideo();
      else youtubePlayer.playVideo();
    });
    previousButton.addEventListener('click', () => youtubePlayer?.previousVideo());
    nextButton.addEventListener('click', () => youtubePlayer?.nextVideo());
    customMute.addEventListener('click', () => {
      if (!youtubePlayer) return;
      if (youtubePlayer.isMuted()) {
        youtubePlayer.unMute();
        customMute.textContent = 'Mute';
        customMute.setAttribute('aria-label', 'Mute playback');
        customMute.setAttribute('aria-pressed', 'false');
      } else {
        youtubePlayer.mute();
        customMute.textContent = 'Sound';
        customMute.setAttribute('aria-label', 'Unmute playback');
        customMute.setAttribute('aria-pressed', 'true');
      }
    });
    volume.addEventListener('input', () => {
      youtubePlayer?.setVolume(Number(volume.value));
      if (Number(volume.value) > 0 && youtubePlayer?.isMuted()) youtubePlayer.unMute();
      if (Number(volume.value) === 0 && !youtubePlayer?.isMuted()) youtubePlayer.mute();
      customMute.setAttribute('aria-pressed', String(youtubePlayer?.isMuted() || false));
      customMute.textContent = youtubePlayer?.isMuted() ? 'Sound' : 'Mute';
      customMute.setAttribute('aria-label', youtubePlayer?.isMuted() ? 'Unmute playback' : 'Mute playback');
    });
    seek.addEventListener('input', () => {
      draggingSeek = true;
      currentTime.textContent = formatTime(Number(seek.value));
    });
    seek.addEventListener('change', () => {
      youtubePlayer?.seekTo(Number(seek.value), true);
      draggingSeek = false;
    });
    seek.addEventListener('pointerup', () => { draggingSeek = false; });

    window.onYouTubeIframeAPIReady = initializeYoutube;

    document.querySelector('.about-button').addEventListener('click', () => { aboutOverlay.hidden = false; });
    document.querySelector('.about-close').addEventListener('click', () => { aboutOverlay.hidden = true; });
    aboutOverlay.addEventListener('click', (event) => {
      if (event.target === aboutOverlay) aboutOverlay.hidden = true;
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') aboutOverlay.hidden = true;
    });
  </script>
  <script>
    const youtubeApiScript = document.createElement('script');
    youtubeApiScript.src = 'https://www.youtube.com/iframe_api';
    youtubeApiScript.async = true;
    youtubeApiScript.onerror = () => { document.querySelector('.custom-status').textContent = 'Could not load YouTube. Check your connection or content blocker.'; };
    document.head.append(youtubeApiScript);
  </script>
</body>
</html>
