<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gym Music Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #121212; color: #ffffff; min-height: 100vh; }
    .hero { height: 100vh; background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=2070') no-repeat center center; background-size: cover; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
    .hero h1 { font-size: 4rem; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 4px; text-shadow: 2px 2px 8px rgba(0,0,0,0.7); }
    .hero p { font-size: 1.5rem; margin-bottom: 40px; text-shadow: 1px 1px 4px rgba(0,0,0,0.7); }
    .player-container { background: #1e1e1e; border-radius: 16px; padding: 30px; width: 100%; max-width: 500px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
  </style>
</head>
<body>
  <section class="hero">
      <div class="progress-container">
        <div class="progress-bar" id="progress-bar" style="width:100%;height:6px;background:#404040;border-radius:3px;cursor:pointer;position:relative;">
          <div class="progress" id="progress" style="height:100%;background:#1db954;border-radius:3px;width:0%;"></div>
        </div>
        <div class="time-info" style="display:flex;justify-content:space-between;font-size:0.85rem;color:#b3b3b3;margin-top:8px;">
          <span id="current-time">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>
      <div class="volume-control" style="display:flex;align-items:center;justify-content:center;gap:10px;margin-top:20px;">
        <button class="volume-btn" id="mute-btn" title="Mute" style="background:none;border:none;color:#fff;cursor:pointer;padding:8px;">
          <svg id="volume-high" width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          <svg id="volume-muted" width="20" height="20" fill="currentColor" viewBox="0 0 24 24" style="display:none"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        </button>
        <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.01" value="1" style="width:150px;height:4px;-webkit-appearance:none;appearance:none;background:#404040;border-radius:2px;outline:none;cursor:pointer;">
      </div>

      <div class="playlist" id="playlist" style="margin-top:30px;max-height:300px;overflow-y:auto;"></div>
    </div>
  </section>

  <audio id="audio-player" preload="metadata"></audio>


      <div class="controls" style="display:flex;align-items:center;justify-content:center;gap:20px;margin-top:25px;">
        <button class="control-btn" id="prev-btn" title="Previous" style="background:none;border:none;color:#fff;cursor:pointer;padding:10px;border-radius:50%;">
          <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="control-btn play-btn" id="play-btn" title="Play" style="width:60px;height:60px;background:#fff;color:#000;border:none;border-radius:50%;cursor:pointer;">
          <svg id="play-icon" width="28" height="28" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pause-icon" width="28" height="28" fill="currentColor" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="control-btn" id="next-btn" title="Next" style="background:none;border:none;color:#fff;cursor:pointer;padding:10px;border-radius:50%;">
          <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>

    <h1>Power Mix</h1>
    <p>Fuel your workout</p>
    <div class="player-container">
      <div class="now-playing">
        <img id="album-art" src="https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?q=80&w=300" alt="Album Art" style="width:200px;height:200px;border-radius:12px;object-fit:cover;margin-bottom:20px;">
        <div class="song-title" id="song-title">Power Up</div>
        <div class="song-artist" id="song-artist">Gym Beats</div>
      </div>
